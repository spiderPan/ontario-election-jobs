name: Nightly Crawl & Deploy to GitHub Pages

on:
  schedule:
    # Runs automatically at 04:00 UTC every day (Midnight EDT / 11:00 PM EST)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab
  push:
    branches:
      - main

# Sets minimal permissions needed to deploy directly to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  crawl_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crawler & Generate Fresh Datasets
        run: |
          python main.py crawl

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
